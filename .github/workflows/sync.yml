          # Hugging Face dataset card is built in the README step, outside this
          # checkout — see hf-card.md there. Nothing to do here.

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Every date written above comes from the data, so an unchanged
          # dataset produces byte-identical files and this guard stops the run
          # without a commit. A scheduled job that commits nothing is invisible;
          # one that commits an empty diff back to 11 repos is bulk activity.
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Sync $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -m "Update $EVENT_NAME deal history and README"
          git push

      - name: Push Hugging Face mirror
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          pip install --quiet 'huggingface_hub>=0.20'
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi, CommitOperationAdd

          api = HfApi(token=os.environ['HF_TOKEN'])
          repo_id = f"{os.environ['HF_NAMESPACE']}/{os.environ['REPO_NAME']}"

          # Surface a missing dataset repo as a warning annotation instead of
          # passing silently, while leaving the GitHub mirror step unaffected.
          try:
              api.repo_info(repo_id=repo_id, repo_type='dataset')
          except Exception:
              print(f"::warning::HF dataset {repo_id} does not exist - skipping upload")
              raise SystemExit(0)

          # One commit for the whole mirror. Uploading the folder and then each
          # file separately wrote several commits per run, all carrying the same
          # data — the kind of repeated bulk activity the Hub treats as spam.
          ops = []
          for root, _, files in os.walk('datasets'):
              for name in files:
                  src = os.path.join(root, name)
                  ops.append(CommitOperationAdd(
                      path_in_repo=src.replace(os.sep, '/'),
                      path_or_fileobj=src,
                  ))
          for f in ['llms.txt', 'ai.txt']:
              if os.path.exists(f):
                  ops.append(CommitOperationAdd(path_in_repo=f, path_or_fileobj=f))
          # The card comes from the README step, which writes it outside this
          # checkout so the GitHub repo keeps the full README and the Hub gets
          # the short one.
          card = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'hf-card.md')
          if os.path.exists(card):
              ops.append(CommitOperationAdd(
                  path_in_repo='README.md', path_or_fileobj=card))

          api.create_commit(
              repo_id=repo_id,
              repo_type='dataset',
              operations=ops,
              commit_message='Sync event deals',
          )
          PY